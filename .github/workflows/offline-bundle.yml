name: offline-bundle

# Builds the lab 12 offline bootstrap bundle (installers, Ubuntu 24.04 packages, registry
# image, lab snapshot), proves it installs with no network, and updates the public
# offline-bundle release atomically (--clobber, zero 404 downtime) with SHA256 checksums
# and MANIFEST.json for every published asset.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "12-bootstrap-machine/**"
      - ".github/workflows/offline-bundle.yml"

concurrency:
  group: offline-bundle
  cancel-in-progress: true

jobs:
  gate-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check bash syntax and ShellCheck on Lab 12 scripts
        run: |
          mapfile -t scripts < <(find 12-bootstrap-machine/scripts -name '*.sh' | sort)
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck -S error "${scripts[@]}"

      - name: Run repo hygiene, pure-ASCII PS1, English-only, and 3-version compat tests
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --break-system-packages pyyaml
          python3 12-bootstrap-machine/tests/test_repo_hygiene.py

      - name: Run 9-scenario Prism Central role suite on Linux (pwsh 7 + Python 3)
        run: python3 12-bootstrap-machine/tests/test_prism_role.py

  gate-windows-ps51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify ALL .ps1 scripts parse on real Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in (Get-ChildItem -Recurse -Filter '*.ps1')) {
              $t = $null; $e = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
              if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error "$($f.FullName): $_" }; exit 1 }
              Write-Host "PS 5.1 AST OK: $($f.Name)"
          }

      - name: Run 9-scenario Prism Central role suite on real Windows PowerShell 5.1
        shell: pwsh
        env:
          PWSH_BIN: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        run: python 12-bootstrap-machine/tests/test_prism_role.py

  bundle:
    needs: [gate-linux, gate-windows-ps51]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: cloud-init-offline.yaml matches cloud-init.yaml
        run: bash 12-bootstrap-machine/scripts/make-offline-cloud-init.sh --check

      - name: Cache offline bundle downloads
        uses: actions/cache@v4
        with:
          path: dist/.cache
          key: offline-cache-${{ hashFiles('12-bootstrap-machine/versions.env', '12-bootstrap-machine/scripts/bootstrap-host.sh', '12-bootstrap-machine/scripts/build-offline-bundle.sh') }}
          restore-keys: |
            offline-cache-

      - name: Build the offline bundle and release assets
        id: build
        env:
          NKP_FALLBACK_BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/offline-bundle/nkp-bootstrap-offline-v2.19.1-noble-amd64.tar.gz
        run: |
          bash 12-bootstrap-machine/scripts/build-offline-bundle.sh "$PWD/dist"
          cp 12-bootstrap-machine/cloud-init-offline.yaml dist/
          echo "name=$(basename dist/nkp-bootstrap-offline-*.tar.gz .tar.gz)" >> "$GITHUB_OUTPUT"

          # Build NKP Pulse air-gapped OCI image bundle using the cached nkp CLI
          nkp_tmp="$(mktemp -d)"
          tar -xzf dist/.cache/nkp_*_linux_amd64.tar.gz -C "${nkp_tmp}" nkp
          chmod +x "${nkp_tmp}/nkp"
          NKP_BIN="${nkp_tmp}/nkp" bash 12-bootstrap-machine/scripts/build-pulse-bundle.sh "$PWD/dist"
          rm -rf "${nkp_tmp}"
          pulse_name="$(basename dist/nkp-pulse-image-bundle-*.tar)"
          echo "pulse_name=${pulse_name}" >> "$GITHUB_OUTPUT"

          git archive --format=tar.gz --output dist/nkp-labs-update.tar.gz HEAD 12-bootstrap-machine
          cp 12-bootstrap-machine/scripts/update-bastion.sh dist/update-bastion.sh
          cp 12-bootstrap-machine/scripts/update-bastion.ps1 dist/update-bastion.ps1
          cp 12-bootstrap-machine/scripts/create-prism-role.ps1 dist/create-prism-role.ps1
          cp 12-bootstrap-machine/scripts/create-prism-role.py dist/create-prism-role.py
          cp 12-bootstrap-machine/scripts/fix-pulse-airgap.sh dist/fix-pulse-airgap.sh

          # Generate per-asset .sha256 files and MANIFEST.json for verified auto-update
          (
            cd dist
            for asset in \
              cloud-init-offline.yaml \
              nkp-labs-update.tar.gz \
              update-bastion.sh \
              update-bastion.ps1 \
              create-prism-role.ps1 \
              create-prism-role.py \
              fix-pulse-airgap.sh; do
              sha256sum "${asset}" > "${asset}.sha256"
            done
          )
          python3 - "$PWD/dist" "$GITHUB_SHA" "$PWD/12-bootstrap-machine/versions.env" <<'PY'
          import datetime, hashlib, json, os, re, sys
          dist, sha, ver_file = sys.argv[1], sys.argv[2], sys.argv[3]
          versions = {}
          for line in open(ver_file, encoding="utf-8"):
              m = re.match(r'^([A-Z0-9_]+)="?([^"#\n]+)"?', line.strip())
              if m:
                  versions[m.group(1)] = m.group(2).strip()
          lab_ver = versions.get("LAB_VERSION", "1.3.0")
          compat_window = int(versions.get("LAB_COMPAT_WINDOW", "3"))
          maj, min_, _ = (int(x) for x in lab_ver.split("."))
          prev_versions = [f"{maj}.{m}.0" for m in range(min_ - 1, max(-1, min_ - compat_window - 1), -1)]
          min_compat = versions.get("LAB_MIN_COMPAT_VERSION", prev_versions[-1] if prev_versions else lab_ver)
          assets = {}
          for fn in sorted(os.listdir(dist)):
              full = os.path.join(dist, fn)
              if not os.path.isfile(full) or fn == "MANIFEST.json" or fn.endswith(".sha256"):
                  continue
              h = hashlib.sha256(open(full, "rb").read()).hexdigest()
              assets[fn] = {"sha256": h, "size": os.path.getsize(full)}
          manifest = {
              "lab_version": lab_ver,
              "compat_window": compat_window,
              "min_compatible_version": min_compat,
              "compatible_previous_versions": prev_versions,
              "git_sha": sha[:12],
              "git_sha_full": sha,
              "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": assets,
          }
          with open(os.path.join(dist, "MANIFEST.json"), "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY

      - name: Install it in Ubuntu 24.04 with no network
        run: bash 12-bootstrap-machine/scripts/verify-offline-bundle.sh "dist/${{ steps.build.outputs.name }}.tar.gz"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            dist/${{ steps.build.outputs.name }}.tar.gz
            dist/${{ steps.build.outputs.name }}.tar.gz.sha256
            dist/${{ steps.build.outputs.pulse_name }}
            dist/${{ steps.build.outputs.pulse_name }}.sha256
            dist/cloud-init-offline.yaml
            dist/MANIFEST.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Publish assets atomically on the public offline-bundle release (zero-downtime)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${{ steps.build.outputs.name }}"
          pulse_name="${{ steps.build.outputs.pulse_name }}"
          notes="Built from ${GITHUB_SHA}. Verified offline install on Ubuntu 24.04. Includes NKP Pulse offline image bundle (${pulse_name}). Download needs no login."
          assets=(
            "dist/${name}.tar.gz"
            "dist/${name}.tar.gz.sha256"
            "dist/${pulse_name}"
            "dist/${pulse_name}.sha256"
            dist/cloud-init-offline.yaml
            dist/cloud-init-offline.yaml.sha256
            dist/nkp-labs-update.tar.gz
            dist/nkp-labs-update.tar.gz.sha256
            dist/update-bastion.sh
            dist/update-bastion.sh.sha256
            dist/update-bastion.ps1
            dist/update-bastion.ps1.sha256
            dist/create-prism-role.ps1
            dist/create-prism-role.ps1.sha256
            dist/create-prism-role.py
            dist/create-prism-role.py.sha256
            dist/fix-pulse-airgap.sh
            dist/fix-pulse-airgap.sh.sha256
            dist/MANIFEST.json
          )
          if gh release view offline-bundle --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload offline-bundle --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit offline-bundle --repo "$GITHUB_REPOSITORY" \
              --title "NKP offline bootstrap bundle" \
              --notes "${notes}"
          else
            gh release create offline-bundle \
              --repo "$GITHUB_REPOSITORY" \
              --title "NKP offline bootstrap bundle" \
              --notes "${notes}" \
              "${assets[@]}"
          fi
