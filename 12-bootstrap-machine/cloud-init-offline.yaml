#cloud-config
# OFFLINE cloud-init (generated from cloud-init.yaml by scripts/make-offline-cloud-init.sh,
# do not edit). Nothing here uses the internet or git. After boot the VM waits for the
# offline bundle, checks it, and installs only from it:
#   client$ ./scripts/get-offline-bundle.sh
#   client$ ./scripts/push-offline-bundle.sh dist/nkp-bootstrap-offline-*.tar.gz ubuntu@<vm-ip> --follow
# Ubuntu 24.04 amd64 only. Progress: nkp-bootstrap-status. Log: /var/log/nkp-bootstrap.log
# Details: steps/07-offline-bootstrap.md
# Paste this file as-is into Prism Central:
#   Create VM → Guest Customization → Cloud-init → Script (user-data).
# Paste the YAML. Do not base64-encode it. Prism encodes it when it saves the VM.
#
# Prism VM name is the Name field in the wizard. This file only sets the name
# inside the guest. Use the same string in both places.
#
# Before pasting, edit the lines marked EDIT.
# Blocks between ">>> online-only" and "<<< online-only" are left out of

# --- EDIT: guest name (match the Prism VM name) ---
preserve_hostname: false
hostname: nkp-bootstrap
fqdn: nkp-bootstrap.ntnxlab.local
manage_etc_hosts: true

# --- EDIT: login. Password login is on so the first SSH works from Prism. ---
ssh_pwauth: true
disable_root: true
ssh_deletekeys: true

groups:
  - docker

users:
  - name: ubuntu
    gecos: NKP bootstrap
    groups: [docker]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    # EDIT: replace with your public key, or delete this list and use the password.
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIReplaceThisKeyBeforePaste nkp-bootstrap

chpasswd:
  expire: false
  users:
    - name: ubuntu
      password: ChangeMe-NKP-Bootstrap
      type: text

# bootstrap-host.sh runs apt itself (online), or uses only the bundle (offline).
package_update: false
package_upgrade: false

write_files:
  - path: /etc/default/nkp-bootstrap
    permissions: "0644"
    owner: root:root
    content: |
      NKP_MODE=offline
      NKP_VERSION=v2.19.1
      NKP_OFFLINE_DIR=/opt/nkp-offline
      NKP_OFFLINE_DROP=/home/ubuntu

  # Small on purpose. The real install is scripts/bootstrap-host.sh.
  # Offline it comes from the pushed bundle.
  - path: /usr/local/sbin/install-nkp-bootstrap-tools.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      # Offline: wait for nkp-bootstrap-offline-*.tar.gz in NKP_OFFLINE_DROP, check it,
      # unpack it to NKP_OFFLINE_DIR, then run the scripts inside it.
      # With nothing to run yet, exit 1 and systemd tries again in 60s.
      set -uo pipefail
      export PATH="$PATH:/usr/sbin:/sbin:/usr/bin:/bin"
      [ -f /etc/default/nkp-bootstrap ] && . /etc/default/nkp-bootstrap
      LIB="${NKP_LIB_DIR:-/usr/local/lib/nkp-bootstrap}"
      LOG="${NKP_LOG:-/var/log/nkp-bootstrap.log}"
      SCRIPTS="bootstrap-host.sh expand-root-disk.sh update-workspace.sh"
      mkdir -p "${LIB}"
      log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) [loader] $*" | tee -a "${LOG}"; }
      if [ "${NKP_MODE:-online}" = "offline" ]; then
        OFF="${NKP_OFFLINE_DIR:-/opt/nkp-offline}"
        DROP="${NKP_OFFLINE_DROP:-/home/ubuntu}"
        bundle="$(ls -t "${DROP}"/nkp-bootstrap-offline-*.tar.gz 2>/dev/null | head -n1)"
        if [ -n "${bundle}" ]; then
          sig="$(basename "${bundle}") $(stat -c '%s %Y' "${bundle}")"
          if [ "${sig}" != "$(cat "${OFF}/.source" 2>/dev/null)" ]; then
            log "unpacking ${bundle}"
            rm -rf "${OFF}.new"
            mkdir -p "${OFF}.new"
            if tar -xzf "${bundle}" -C "${OFF}.new" --strip-components=1 \
                && (cd "${OFF}.new" && sha256sum -c --quiet SHA256SUMS); then
              rm -rf "${OFF}"
              mv "${OFF}.new" "${OFF}"
              echo "${sig}" > "${OFF}/.source"
              log "bundle ok: $(grep -E '^(git_commit|built)=' "${OFF}/MANIFEST.txt" | tr '\n' ' ')"
            else
              rm -rf "${OFF}.new"
              log "bundle ${bundle} is damaged (tar or sha256). Push it again."
              [ -f "${OFF}/SHA256SUMS" ] || exit 1
              log "running the bundle unpacked before"
            fi
          fi
        fi
        if [ ! -f "${OFF}/SHA256SUMS" ]; then
          log "waiting for nkp-bootstrap-offline-*.tar.gz in ${DROP}. Push it with scripts/push-offline-bundle.sh. systemd checks again in 60s."
          exit 1
        fi
        for f in ${SCRIPTS}; do
          install -m 0755 "${OFF}/labs/12-bootstrap-machine/scripts/${f}" "${LIB}/${f}.new"
          mv -f "${LIB}/${f}.new" "${LIB}/${f}"
        done
        export NKP_OFFLINE_DIR="${OFF}"
      fi
      ln -sf "${LIB}/update-workspace.sh" "${NKP_BIN_DIR:-/usr/local/bin}/nkp-update"
      if [ ! -f "${LIB}/bootstrap-host.sh" ]; then
        log "no bootstrap-host.sh yet. systemd retries in 60s."
        exit 1
      fi
      exec bash "${LIB}/bootstrap-host.sh"

  - path: /etc/systemd/system/nkp-bootstrap.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=NKP bootstrap toolchain (resumes after failures and restarts)
      Wants=network-online.target
      After=network-online.target
      ConditionPathExists=!/var/lib/nkp-bootstrap/complete
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      Environment=HOME=/root
      ExecStart=/usr/local/sbin/install-nkp-bootstrap-tools.sh
      Restart=on-failure
      RestartSec=60
      RestartPreventExitStatus=3

      [Install]
      WantedBy=multi-user.target


  - path: /usr/local/bin/nkp-bootstrap-status
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      # Where the bootstrap and the bundle download stand.
      echo "== steps done (/var/lib/nkp-bootstrap)"
      for f in /var/lib/nkp-bootstrap/*.done; do
        [ -e "$f" ] && printf '  %-16s %s\n' "$(basename "$f" .done)" "$(cat "$f")"
      done
      [ -f /var/lib/nkp-bootstrap/complete ] && echo "  toolchain COMPLETE $(cat /var/lib/nkp-bootstrap/complete)"
      echo "  attempts $(cat /var/lib/nkp-bootstrap/attempts 2>/dev/null || echo 0)"
      for u in nkp-bootstrap nkp-airgap-download; do
        systemctl cat "${u}.service" >/dev/null 2>&1 || continue
        echo "== ${u}.service: $(systemctl is-active "${u}.service" 2>/dev/null) / $(systemctl is-enabled "${u}.service" 2>/dev/null)"
      done
      echo "== air-gapped bundle"
      ls -l /home/ubuntu/nkp-workspace/airgap/ 2>/dev/null || echo "  not started"
      echo "== last log lines (/var/log/nkp-bootstrap.log)"
      tail -n 15 /var/log/nkp-bootstrap.log 2>/dev/null

runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, nkp-bootstrap.service]
  - [systemctl, start, --no-block, nkp-bootstrap.service]

final_message: "cloud-init done. The NKP install continues in nkp-bootstrap.service. Run nkp-bootstrap-status. Log /var/log/nkp-bootstrap.log."
