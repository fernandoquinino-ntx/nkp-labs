# Banco de Occidente — management cluster nkp-mgmt-prodtgu01.
# Copy to values.local.yaml on the bastion. Do not commit values.local.yaml.
# Still required before install: Prism password, PC UUID, storage container, SSH public key.
# Put the password only in values.local.yaml on the bastion. Do not commit it.
# The image NKP_UBUNTU_PRO_2404 must already exist in Prism Central. It does not today.
mode: management
airgapped: true

clusterName: nkp-mgmt-prodtgu01
namespace: kommander
clusterDomain: bancodeoccidente.lan

prism:
  endpoint: "https://192.168.170.15:9440"
  insecure: true
  username: nkp_admin_user
  password: "CHANGE-ME"
  prismCentralUuid: "00000000-0000-0000-0000-000000000000"
  prismElement: "NKP_PRISMELTGU"
  subnet: "VLAN 4031"

clusterNetwork:
  podsCidr: "100.112.0.0/16"
  servicesCidr: "100.113.0.0/16"

controlPlaneEndpointIp: "172.16.112.10"
serviceLoadBalancer:
  rangeStart: "172.16.112.11"
  rangeEnd: "172.16.112.20"

kubernetesVersion: "v1.36.2"
nkpVersion: "v2.19.1"
clusterClassName: "nkp-nutanix-v2.19.1"
image: "NKP_UBUNTU_PRO_2404"
sshPublicKey: ""
sshUsername: konvoy

controlPlane:
  replicas: 3
  vcpu: 4
  memory: "16Gi"
  disk: "80Gi"
workers:
  replicas: 3
  vcpu: 8
  memory: "32Gi"
  disk: "100Gi"

extraAPIServerCertSANs:
  - nkp-mgmt-prodtgu01.bancodeoccidente.lan
  - 172.16.112.10
ntpServers:
  - 10.4.101.18

csi:
  storageContainer: "CHANGE-ME"
  reclaimPolicy: "Delete"
  fileSystem: "ext4"
  flashMode: "DISABLED"
  hypervisorAttached: "ENABLED"

registry:
  server: "https://index.docker.io/v1/"
  username: ""
  password: ""
  email: ""
