{{- if and .Values.registry.username .Values.registry.password }}
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-auth
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nkp-kommander
    app.kubernetes.io/cluster: {{ .Values.clusterName }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "{{ .Values.registry.server }}": {
          "username": "{{ .Values.registry.username }}",
          "password": "{{ .Values.registry.password }}",
          "email": "{{ .Values.registry.email }}",
          "auth": "{{ printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc }}"
        }
      }
    }
{{- end }}
