{{- if .Values.localRegistry.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.localRegistry.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nkp-cluster.providerLabels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.localRegistry.username | quote }}
  password: {{ required "localRegistry.password is empty. install-nkp.sh reads it from registry/credentials.env" .Values.localRegistry.password | quote }}
  ca.crt: |
{{ required "localRegistry.caCrt is empty. Run setup-local-registry.sh first." .Values.localRegistry.caCrt | indent 4 }}
{{- end }}
