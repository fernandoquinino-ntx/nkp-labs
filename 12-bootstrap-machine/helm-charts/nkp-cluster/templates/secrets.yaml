{{- /*
  NKP credential Secrets. `stringData` -> K8s base64-encodes into `data` at apply.
  Always: the 3 per-cluster Secrets (management + managed).
  Management only: `global-nutanix-credentials` (capx-system) + `prism-central-metadata`.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clusterName }}-pc-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nkp-cluster.providerLabels" . | nindent 4 }}
type: Opaque
stringData:
  credentials: '[{"type":"basic_auth","data":{"prismCentral":{"username":"{{ .Values.prism.username }}","password":"{{ .Values.prism.password }}"}}}]'
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clusterName }}-pc-credentials-for-csi
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nkp-cluster.providerLabels" . | nindent 4 }}
type: Opaque
stringData:
  key: "{{ include "nkp-cluster.prismHostPort" . }}:{{ .Values.prism.username }}:{{ .Values.prism.password }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clusterName }}-pc-credentials-for-konnector-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nkp-cluster.providerLabels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.prism.username }}
  password: {{ .Values.prism.password }}
{{- if eq .Values.mode "management" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: global-nutanix-credentials
  namespace: capx-system
  labels:
    clusterctl.cluster.x-k8s.io/move: ""
    dkp-infrastructure-provider-type: nutanix-secret
type: Opaque
stringData:
  username: {{ .Values.prism.username }}
  password: {{ .Values.prism.password }}
  prismURL: {{ .Values.prism.endpoint }}
  insecure: {{ .Values.prism.insecure | quote }}
  additionalTrustBundle: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: prism-central-metadata
  namespace: {{ .Values.namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ .Values.clusterName }}
    clusterctl.cluster.x-k8s.io/move: ""
type: Opaque
immutable: true
stringData:
  uuid: {{ .Values.prism.prismCentralUuid }}
{{- end }}
