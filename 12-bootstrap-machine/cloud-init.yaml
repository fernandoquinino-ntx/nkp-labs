#cloud-config
# Paste this file as-is into Prism Central:
#   Create VM → Guest Customization → Cloud-init → Script (user-data).
# Paste the YAML. Do not base64-encode it. Prism encodes it when it saves the VM.
#
# Prism VM name is the Name field in the wizard. This file only sets the name
# inside the guest. Use the same string in both places.
#
# Before pasting, edit the lines marked EDIT.
# Ubuntu 24.04 cloud image is the primary target. The same file also grows a
# Rocky LVM root disk and installs packages with dnf when that is the image.
#
# The install runs in nkp-bootstrap.service, not inside cloud-init. Every run first
# downloads the latest scripts/bootstrap-host.sh from nkp-labs, so a fix pushed to git
# needs no new paste: run `nkp-update --rerun` on the VM. Each finished
# step leaves /var/lib/nkp-bootstrap/<step>.done. A network drop or a VM restart
# re-runs the service and it continues from the first unfinished step.
# The air-gapped bundle downloads afterwards in nkp-airgap-download.service and
# resumes from the last byte. Check both with: nkp-bootstrap-status

# --- EDIT: guest name (match the Prism VM name) ---
preserve_hostname: false
hostname: nkp-bootstrap
fqdn: nkp-bootstrap.ntnxlab.local
manage_etc_hosts: true

# --- EDIT: login. Password login is on so the first SSH works from Prism. ---
ssh_pwauth: true
disable_root: true
ssh_deletekeys: true

groups:
  - docker

users:
  - name: ubuntu
    gecos: NKP bootstrap
    groups: [docker]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    # EDIT: replace with your public key, or delete this list and use the password.
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIReplaceThisKeyBeforePaste nkp-bootstrap

chpasswd:
  expire: false
  users:
    - name: ubuntu
      password: ChangeMe-NKP-Bootstrap
      type: text

package_update: true
package_upgrade: false

write_files:
  # EDIT: set NKP_SKIP_AIRGAP=true for a connected install (no 33 GiB download).
  - path: /etc/default/nkp-bootstrap
    permissions: "0644"
    owner: root:root
    content: |
      NKP_VERSION=v2.19.1
      NKP_SKIP_AIRGAP=false
      NKP_LABS_REPO=https://github.com/fernandoquinino-ntx/nkp-labs.git
      NKP_LABS_REF=main

  # Small on purpose. The real install is scripts/bootstrap-host.sh in nkp-labs, fetched
  # fresh on every run, so a fix pushed to git applies at the next run without a new paste.
  - path: /usr/local/sbin/install-nkp-bootstrap-tools.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      # Download the latest bootstrap scripts from nkp-labs, then run them. If GitHub cannot
      # be reached, run the copy from the last good download. With no copy at all, exit 1
      # and systemd tries again in 60s.
      set -uo pipefail
      export PATH="$PATH:/usr/sbin:/sbin:/usr/bin:/bin"
      [ -f /etc/default/nkp-bootstrap ] && . /etc/default/nkp-bootstrap
      RAW="${NKP_LABS_RAW:-https://raw.githubusercontent.com/fernandoquinino-ntx/nkp-labs}/${NKP_LABS_REF:-main}/12-bootstrap-machine/scripts"
      LIB="${NKP_LIB_DIR:-/usr/local/lib/nkp-bootstrap}"
      LOG="${NKP_LOG:-/var/log/nkp-bootstrap.log}"
      mkdir -p "${LIB}"
      log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) [loader] $*" | tee -a "${LOG}"; }
      online=true
      for f in bootstrap-host.sh expand-root-disk.sh update-workspace.sh; do
        got=false
        if [ "${online}" = true ]; then
          for i in 1 2 3 4; do
            # The query string skips the raw.githubusercontent.com cache (about 5 min).
            if curl -fsSL --connect-timeout 15 --max-time 120 -o "${LIB}/${f}.new" "${RAW}/${f}?t=$(date +%s)" \
                && bash -n "${LIB}/${f}.new"; then
              chmod 0755 "${LIB}/${f}.new"
              mv -f "${LIB}/${f}.new" "${LIB}/${f}"
              got=true
              break
            fi
            sleep $((i * 5))
          done
        fi
        rm -f "${LIB}/${f}.new"
        if [ "${got}" = true ]; then
          log "fetched latest ${f} from ${RAW}"
        else
          online=false
          log "could not fetch ${f}. Using the cached copy if there is one."
        fi
      done
      ln -sf "${LIB}/update-workspace.sh" "${NKP_BIN_DIR:-/usr/local/bin}/nkp-update"
      if [ ! -f "${LIB}/bootstrap-host.sh" ]; then
        log "no bootstrap-host.sh yet (no internet on the first run). systemd retries in 60s."
        exit 1
      fi
      exec bash "${LIB}/bootstrap-host.sh"

  - path: /etc/systemd/system/nkp-bootstrap.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=NKP bootstrap toolchain (resumes after failures and restarts)
      Wants=network-online.target
      After=network-online.target
      ConditionPathExists=!/var/lib/nkp-bootstrap/complete
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      Environment=HOME=/root
      ExecStart=/usr/local/sbin/install-nkp-bootstrap-tools.sh
      Restart=on-failure
      RestartSec=60
      RestartPreventExitStatus=3

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/nkp-airgap-download.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=NKP air-gapped bundle download (resumes after failures and restarts)
      Wants=network-online.target
      After=network-online.target
      ConditionPathExists=/home/ubuntu/nkp-workspace/scripts/fetch-airgap-bundle.sh
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      Environment=HOME=/root
      Environment=AIRGAP_DIR=/home/ubuntu/nkp-workspace/airgap
      ExecStart=/home/ubuntu/nkp-workspace/scripts/fetch-airgap-bundle.sh
      ExecStopPost=-/bin/chown -R ubuntu:ubuntu /home/ubuntu/nkp-workspace/airgap
      Restart=on-failure
      RestartSec=300
      RestartPreventExitStatus=3

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/nkp-bootstrap-status
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      # Where the bootstrap and the bundle download stand.
      echo "== steps done (/var/lib/nkp-bootstrap)"
      for f in /var/lib/nkp-bootstrap/*.done; do
        [ -e "$f" ] && printf '  %-16s %s\n' "$(basename "$f" .done)" "$(cat "$f")"
      done
      [ -f /var/lib/nkp-bootstrap/complete ] && echo "  toolchain COMPLETE $(cat /var/lib/nkp-bootstrap/complete)"
      echo "  attempts $(cat /var/lib/nkp-bootstrap/attempts 2>/dev/null || echo 0)"
      for u in nkp-bootstrap nkp-airgap-download; do
        echo "== ${u}.service: $(systemctl is-active "${u}.service" 2>/dev/null) / $(systemctl is-enabled "${u}.service" 2>/dev/null)"
      done
      echo "== air-gapped bundle"
      ls -l /home/ubuntu/nkp-workspace/airgap/ 2>/dev/null || echo "  not started"
      echo "== last log lines (/var/log/nkp-bootstrap.log)"
      tail -n 15 /var/log/nkp-bootstrap.log 2>/dev/null

runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, nkp-bootstrap.service]
  - [systemctl, start, --no-block, nkp-bootstrap.service]

final_message: "cloud-init done. The NKP install continues in nkp-bootstrap.service. Run nkp-bootstrap-status. Log /var/log/nkp-bootstrap.log."
