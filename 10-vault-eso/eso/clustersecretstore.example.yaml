# ClusterSecretStore — the "credential store": HOW ESO reaches Vault and how it authenticates.
#
# This is the RAW object, applied by hand (path B in the README). The SAME object is also rendered
# by the AppDeployment override — see ../overrides/eso-overrides.example.yaml
# (data.values.yaml -> extraObjects -> this exact manifest).
#
# ClusterSecretStore is cluster-scoped (no namespace). A namespaced `SecretStore` would work too,
# but the cluster-scoped form can be referenced from every namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ${SECRETSTORE_NAME}
spec:
  provider:
    vault:
      # Reach Vault on the MANAGEMENT cluster over its ingress (works from any cluster).
      # In-cluster DNS (vault.vault.svc) only resolves ON the management cluster.
      server: ${VAULT_SERVER}
      # Trust anchor: the Root CA that signed Vault's server certificate (base64 PEM).
      caBundle: ${VAULT_CA_BUNDLE}
      # KV v2: the ENGINE mount here ...
      path: ${VAULT_KV_MOUNT}
      version: v2
      auth:
        kubernetes:
          # ... and the AUTH mount on Vault bound to THIS cluster (see vault/remote-auth.md).
          # One kubernetes auth mount PER cluster: the management-bound "kubernetes" mount will NOT
          # validate a ServiceAccount token minted by ds-cluster01.
          mountPath: ${VAULT_AUTH_MOUNT}
          role: ${VAULT_ROLE}
          # ESO presents this ServiceAccount's token; Vault verifies it via TokenReview.
          serviceAccountRef:
            name: ${ESO_SA}
            namespace: ${ESO_NAMESPACE}
