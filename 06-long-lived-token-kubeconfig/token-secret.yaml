# A LONG-LIVED (non-expiring) token for the ServiceAccount.
#
# The token controller populates `.data.token` with a JWT that has NO `exp` claim — it does not
# expire. This is the classic pre-1.24 mechanism and it STILL works on modern clusters
# (validated on Kubernetes 1.35).
#
# It is fine for a LAB / a single trusted app. For CI prefer a short-lived bound token
# (`kubectl create token <sa> --duration 24h`), or use a client-certificate kubeconfig.
apiVersion: v1
kind: Secret
metadata:
  name: ${SA_NAME}-token
  namespace: ${NAMESPACE}
  annotations:
    kubernetes.io/service-account.name: ${SA_NAME}   # must match the ServiceAccount
type: kubernetes.io/service-account-token
