# ExternalSecret — the request: "pull these keys from that store and materialise a Kubernetes
# Secret here, and keep it in sync."
#
# This is the RAW object (path B). The same object is rendered by the AppDeployment override.
#
# KV v2 path mapping (the #1 gotcha):
#   provider.path = `secret` (the mount)  +  remoteRef.key = `app-credentials` (the item)
#   => Vault path `secret/data/app-credentials`.
#   Do NOT write `key: secret/app-credentials` — that would double the mount.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${EXTERNAL_SECRET_NAME}
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ${SECRETSTORE_NAME}
    kind: ClusterSecretStore
  target:
    # The Kubernetes Secret ESO creates/owns and keeps in sync.
    name: ${EXTERNAL_SECRET_NAME}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ${VAULT_SECRET_PATH}
        property: username
    - secretKey: password
      remoteRef:
        key: ${VAULT_SECRET_PATH}
        property: password
