# ESO AppDeployment OVERRIDE — defines ONLY the "credential store" (the ClusterSecretStore).
#
# ┌─ WHY A CONFIGMAP OF HELM VALUES? ────────────────────────────────────────────────────────────┐
# │ An AppDeployment can only feed HELM VALUES to an app (it merges this ConfigMap into the app's  │
# │ HelmRelease). A ClusterSecretStore is a CR, not a Helm value — so to make the store settable   │
# │ from the UI it must be RENDERED BY THE APP'S CHART. The external-secrets chart supports        │
# │ `extraObjects:` (extra manifests it renders, through `tpl`). We use it for exactly one object: │
# │ the ClusterSecretStore.                                                                        │
# └──────────────────────────────────────────────────────────────────────────────────────────────┘
#
# The store is SHARED infrastructure: define it ONCE here, and every consumer just references it.
# Anything a consumer pulls (the ExternalSecret, the app that mounts the Secret) is NOT part of the
# store — it is the testing/consumer side (see ../eso/externalsecret.example.yaml +
# ../app/deployment.yaml).
#
# COPY -> eso-overrides.yaml ; apply in the WORKSPACE namespace BEFORE the AppDeployment:
#   kubectl -n ${WORKSPACE_NS} apply -f eso-overrides.yaml
#
# The Kommander controller merges it into the ESO HelmRelease on the target cluster:
#   HelmRelease.spec.valuesFrom = [ external-secrets-<ver>-config-defaults,
#                                   external-secrets-overrides   <-- THIS ConfigMap (optional),
#                                   external-secrets-cluster-overrides ]
#
# In the UI:  Management Cluster Workspace ▸ Applications ▸ External Secrets Operator ▸ ⋯ ▸ Edit
#             -> that editor IS this ConfigMap's data.values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${ESO_OVERRIDES_CM}
  namespace: ${WORKSPACE_NS}
data:
  values.yaml: |
    # Only the credential store lives here. Set the Vault connection once; consumers reuse it.
    extraObjects:
      - apiVersion: external-secrets.io/v1
        kind: ClusterSecretStore
        metadata:
          name: ${SECRETSTORE_NAME}
        spec:
          provider:
            vault:
              server: ${VAULT_SERVER}
              caBundle: ${VAULT_CA_BUNDLE}
              path: ${VAULT_KV_MOUNT}
              version: v2
              auth:
                kubernetes:
                  mountPath: ${VAULT_AUTH_MOUNT}
                  role: ${VAULT_ROLE}
                  serviceAccountRef:
                    name: ${ESO_SA}
                    namespace: ${ESO_NAMESPACE}
