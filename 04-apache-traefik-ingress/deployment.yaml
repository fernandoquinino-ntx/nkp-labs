# Apache + a static page (ConfigMap) — for the ingress lab.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-html
  namespace: ${NAMESPACE}
data:
  index.html: |
    <html><body>
      <h1>Hello from Apache on Kubernetes</h1>
      <p>Served through an Ingress hostname.</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: ${NAMESPACE}
  labels: { app: apache }
spec:
  replicas: 2
  selector:
    matchLabels: { app: apache }
  template:
    metadata:
      labels: { app: apache }
    spec:
      containers:
        - name: apache
          image: httpd:2.4
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs
              readOnly: true
      volumes:
        - name: html
          configMap: { name: apache-html }
