# The OIDC credentials + session key, read by the Traefik plugin at runtime.
#
# The Middleware does NOT hold the values inline — it references them with the
# `urn:k8s:secret:<name>:<key>` syntax (see 06-create-middleware). The plugin resolves
# that reference against THIS Secret. Keep it in the SAME namespace as the Middleware.
#
# COPY -> oidc/secret.yaml, fill it in (or let scripts/install.sh create it straight
# from local.env), then `kubectl apply`. NEVER commit the filled file.
#
#   kubectl -n "$NAMESPACE" apply -f oidc/secret.yaml
#
# CLIENT_ID     — the Okta OIDC app's Client ID (not secret, kept here for tidiness).
# CLIENT_SECRET — the Okta OIDC app's Client Secret.
# SESSION_KEY   — a random string of AT LEAST 32 bytes used to encrypt the session
#                 cookie. Generate with:  openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: okta-oidc
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: traefik-oidc-lab
type: Opaque
stringData:
  CLIENT_ID: "${OKTA_CLIENT_ID}"
  CLIENT_SECRET: "${OKTA_CLIENT_SECRET}"
  SESSION_KEY: "${OIDC_SESSION_KEY}"
