# The S3-compatible credentials Velero uses for a BSL.
#
# COPY -> velero-offsite-credentials.yaml ; fill in the keys ; apply it B E F O R E the override
# ConfigMap / AppDeployment.  NEVER commit the filled file.
#
# The file under `cloud:` is an AWS credentials INI. Its PROFILE NAME must match the `profile` you set
# in the BSL config (`configuration.backupStorageLocation[].config.profile`).
apiVersion: v1
kind: Secret
metadata:
  name: velero-offsite-credentials
  namespace: ${VELERO_NS}
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id=<ACCESS_KEY>
    aws_secret_access_key=<SECRET_KEY>

    [secondary]
    aws_access_key_id=<ACCESS_KEY>
    aws_secret_access_key=<SECRET_KEY>
